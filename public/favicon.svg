<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="32" height="32" rx="6"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- Globe outer ring -->
  <circle cx="16" cy="14" r="8.5" fill="none" stroke="white" stroke-width="2"/>

  <!-- Globe meridian — top arc -->
  <path d="M7.5 14 Q16 9.5 24.5 14"
        stroke="white" stroke-width="1.3" fill="none"
        stroke-linecap="round" opacity="0.75"/>

  <!-- Globe meridian — bottom arc -->
  <path d="M7.5 14 Q16 18.5 24.5 14"
        stroke="white" stroke-width="1.3" fill="none"
        stroke-linecap="round" opacity="0.4"/>

  <!-- Globe vertical axis -->
  <line x1="16" y1="5.5" x2="16" y2="22.5"
        stroke="white" stroke-width="1.3" opacity="0.45"/>

  <!-- Wave at bottom — represents ocean / marine / climate data -->
  <path d="M3 27.5 C5.5 25 8.5 30 11.5 27.5 C14.5 25 17.5 30 20.5 27.5 C23 25.5 26 29 29 27.5"
        stroke="white" stroke-width="2.3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
